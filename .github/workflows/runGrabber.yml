name: LinkGrabber

on:
  schedule:
    - cron: '0 */3 * * *'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  runCode:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Grab Link and Update File
        run: |
          git config --global user.email "dp247@hll.localhost"
          git config --global user.name "dp247"
          
          chmod +x exec_grabber.sh
          ./exec_grabber.sh
          
          git add youtube.m3u8 youtubeLink.txt 2>/dev/null || git add -A
          
          if ! git diff --staged --quiet; then
            git commit -m "Auto update playlist: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
            git push
            echo "File berhasil diperbarui dan di-push."
          else
            echo "Tidak ada perubahan pada file playlist (Skip push)."
          fi
