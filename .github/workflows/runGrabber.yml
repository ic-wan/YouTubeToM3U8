      - name: Grab Link and Update File
        run: |
          git config --global user.email "dp247@hll.localhost"
          git config --global user.name "dp247"
          
          chmod +x exec_grabber.sh
          
          # Eksekusi skrip dan tampilkan outputnya ke console untuk debugging
          ./exec_grabber.sh
          
          # Tampilkan isi youtube.m3u8 di log untuk memastikan file terisi
          echo "--- ISI FILE YOUTUBE.M3U8 ---"
          cat youtube.m3u8 || echo "File youtube.m3u8 tidak ditemukan"
          echo "-----------------------------"
          
          git add -A
          
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "Auto update playlist: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
            git push
            echo "File berhasil diperbarui dan di-push ke GitHub."
          else
            echo "Git membaca tidak ada perbedaan isi file."
          fi
