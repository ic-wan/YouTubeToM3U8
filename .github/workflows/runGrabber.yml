import sys
import yt_dlp

# Daftar channel/video live target
channels = {
    "TVRI National": "https://www.youtube.com/@TVRINational/live",
    "Metro TV": "https://www.youtube.com/@metrotvsys/live",
}

ydl_opts = {
    'quiet': True,
    'no_warnings': True,
    'format': 'best',
}

print("#EXTM3U")

for name, url in channels.items():
    try:
        with yt_dlp.YoutubeDL(ydl_opts) as ydl:
            info = ydl.extract_info(url, download=False)
            stream_url = info.get('url')
            if stream_url:
                print(f'#EXTINF:-1 group-title="Lokal", {name}')
                print(stream_url)
    except Exception as e:
        print(f"Error fetching {name}: {e}", file=sys.stderr)
