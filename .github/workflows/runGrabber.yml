name: LinkGrabber

on:
  schedule:
    - cron: '0 */3 * * *'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  runCode:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Grab Link and Update File
        run: |
          git config --global user.email "dp247@hll.localhost"
          git config --global user.name "dp247"
          
          # Berikan izin eksekusi dan jalankan skrip
          chmod +x exec_grabber.sh
          ./exec_grabber.sh
          
          # Tambahkan berkas spesifik secara eksplisit
          git add youtube.m3u8 youtubeLink.txt 2>/dev/null || git add -A
          
          # Cek status perubahan
          if ! git diff --staged --quiet; then
            git commit -m "Auto update playlist: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
            git push
            echo "File berhasil diperbarui dan di-push ke GitHub."
          else
            echo "Tidak ada perubahan pada file playlist (Skip push)."
          fi
