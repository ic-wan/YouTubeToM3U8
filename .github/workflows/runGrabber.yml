import sys
import yt_dlp

# Daftar channel/video live yang ingin di-grab
channels = {
    "TVRI National": "https://www.youtube.com/@TVRINational/live",
    "Metro TV": "https://www.youtube.com/@metrotvsys/live",
    # Tambahkan channel lain di sini: "Nama Channel": "URL Live"
}

ydl_opts = {
    'quiet': True,
    'no_warnings': True,
    'format': 'best',
}

m3u_lines = ["#EXTM3U"]

for name, url in channels.items():
    try:
        with yt_dlp.YoutubeDL(ydl_opts) as ydl:
            info = ydl.extract_info(url, download=False)
            stream_url = info.get('url')
            if stream_url:
                m3u_lines.append(f'#EXTINF:-1 group-title="Lokal", {name}')
                m3u_lines.append(stream_url)
    except Exception as e:
        # Jika gagal/offline, cetak error ke log stderr tanpa merusak format M3U
        print(f"Error fetching {name}: {e}", file=sys.stderr)

# Cetak hasil ke stdout agar ditangkap oleh exec_grabber.sh (> ./youtube.m3u8)
print("\n".join(m3u_lines))
