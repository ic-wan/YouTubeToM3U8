import sys
import yt_dlp

ydl_opts = {
    'quiet': True,
    'no_warnings': True,
    'format': 'best',
}

print("#EXTM3U")

try:
    with open("youtubeLink.txt", "r", encoding="utf-8") as f:
        lines = [line.strip() for line in f if line.strip() and not line.strip().startswith("##")]

    i = 0
    while i < len(lines):
        meta_line = lines[i]
        
        # Cek apakah baris ini berisi metadata dengan pemisah '||'
        if "||" in meta_line and (i + 1) < len(lines):
            url_line = lines[i + 1]
            
            # Extract metadata: Nama || ID || Kategori
            parts = [p.strip() for p in meta_line.split("||")]
            name = parts[0] if len(parts) > 0 else "YouTube Live"
            tvg_id = parts[1] if len(parts) > 1 else "yt.live"
            group = parts[2] if len(parts) > 2 else "General"
            
            # Jika baris bawahnya adalah URL langsung (.m3u8)
            if url_line.endswith(".m3u8"):
                print(f'#EXTINF:-1 tvg-id="{tvg_id}" tvg-name="{name}" group-title="{group}", {name}')
                print(url_line)
            # Jika baris bawahnya adalah link YouTube
            else:
                try:
                    with yt_dlp.YoutubeDL(ydl_opts) as ydl:
                        info = ydl.extract_info(url_line, download=False)
                        stream_url = info.get('url')
                        if stream_url:
                            print(f'#EXTINF:-1 tvg-id="{tvg_id}" tvg-name="{name}" group-title="{group}", {name}')
                            print(stream_url)
                        else:
                            print(f"URL stream tidak ditemukan: {name}", file=sys.stderr)
                except Exception as e:
                    print(f"Error grab {name}: {e}", file=sys.stderr)
            
            # Loncat 2 baris (meta + url)
            i += 2
        else:
            i += 1

except FileNotFoundError:
    print("File youtubeLink.txt tidak ditemukan!", file=sys.stderr)
